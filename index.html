<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
    />
    <title>DatABA</title>
    <meta name="description" content="Collecte de données ABA en contexte de groupe" />

    <!-- Thème clair/sombre choisi avant le premier rendu : évite le flash d'un
         thème puis l'autre. Préférence explicite sinon système ; clé aba: en
         clair, ce n'est pas une donnée sensible. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('aba:theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', t);
          document.addEventListener('DOMContentLoaded', function () {
            var m = document.querySelector('meta[name="theme-color"]');
            if (m) m.setAttribute('content', t === 'dark' ? '#0A1120' : '#F3F6FB');
          });
        } catch (e) {}
      })();
    </script>

    <!-- Manifeste : icône, plein écran, installation sur l'écran d'accueil -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#F3F6FB" />

    <!-- iOS : mode plein écran depuis l'écran d'accueil -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DatABA" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <link rel="icon" type="image/png" href="./icon-192.png" />

    <!-- Polices embarquées (src/index.css, @font-face) plutôt que chargées
         depuis fonts.googleapis.com : aucune requête réseau à l'exécution,
         donc pas de retour aux polices système hors connexion — y compris
         sur PC, où une visite sans passage préalable en ligne ne laissait
         jamais au navigateur la chance de mettre en cache HTTP le lien
         Google Fonts. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.jsx"></script>
  </body>
</html>
